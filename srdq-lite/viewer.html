<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRDQ Lite 报告</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#dfe4ec;--text:#182230;--muted:#687386;--accent:#2563eb;--pass:#16803c;--diff:#b45309;--error:#be123c;--blocked:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}header h1{font-size:20px;margin:0 auto 0 0}button,.upload{border:1px solid #60708a;background:#fff;color:#182230;border-radius:7px;padding:7px 12px;cursor:pointer}.upload input{display:none}main{max-width:1500px;margin:auto;padding:20px}.drop{border:2px dashed #a9b4c5;border-radius:10px;padding:30px;text-align:center;background:#fff;color:var(--muted)}.drop.over{border-color:var(--accent);background:#eff6ff}.hidden{display:none!important}.toolbar,.cards,.layout{display:flex;gap:12px;flex-wrap:wrap}.toolbar{margin:16px 0}.toolbar input,.toolbar select{padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff}.toolbar input{min-width:260px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.cards{margin:16px 0}.card{padding:13px 16px;min-width:135px}.card b{font-size:23px;display:block}.card span{color:var(--muted)}.layout{align-items:flex-start}.tables{flex:1;min-width:560px}.detail{flex:1.35;min-width:620px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.panel h2,.panel h3{margin:0;padding:12px 15px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;white-space:nowrap;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f8fafc;color:#536073;position:sticky;top:0}tr.click{cursor:pointer}tr.click:hover,tr.selected{background:#eff6ff}.status{font-weight:700}.PASS{color:var(--pass)}.DIFF{color:var(--diff)}.ERROR{color:var(--error)}.BLOCKED{color:var(--blocked)}.SKIPPED{color:var(--muted)}.section{padding:12px 15px;border-bottom:1px solid var(--line)}.section h3{padding:0 0 8px;border:0}.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px}.kv span:nth-child(odd){color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.45 ui-monospace,monospace}.src{background:#fff7ed}.tgt{background:#eff6ff}.empty{color:var(--muted);padding:20px;text-align:center}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f7;margin:2px 4px 2px 0}.errorbox{margin:12px 0;padding:10px;background:#fff1f2;color:#9f1239;border-radius:7px}@media(max-width:1100px){.detail{position:static;max-height:none}.tables,.detail{min-width:100%}}
</style>
</head>
<body>
<header><h1>SRDQ Lite 离线报告</h1><label class="upload">选择报告目录<input id="dir" type="file" webkitdirectory multiple></label><label class="upload">选择报告文件<input id="files" type="file" multiple accept=".json,.jsonl"></label><button id="clear">清空</button></header>
<main>
<div id="drop" class="drop">拖放一个或多个报告目录/JSON 文件到这里<br>需要 summary.json、table_summary.jsonl、diffs.jsonl，可选 failed_tasks.jsonl、05_compare.jsonl</div>
<div id="error"></div>
<section id="app" class="hidden">
<div class="toolbar"><select id="run"></select><input id="search" placeholder="搜索库、表或 table_id"><select id="status"><option value="">全部状态</option><option>PASS</option><option>DIFF</option><option>ERROR</option><option>BLOCKED</option><option>SKIPPED</option></select><select id="sort"><option value="input">输入顺序</option><option value="table">表名</option><option value="status">状态</option><option value="diffs">差异数</option></select></div>
<div id="cards" class="cards"></div>
<div class="layout"><div class="panel tables"><h2>表清单</h2><div class="scroll"><table><thead><tr><th>状态</th><th>源表 → 目标表</th><th>COUNT</th><th>METRIC</th><th>SAMPLE</th><th>差异</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div id="detail" class="panel detail"><div class="empty">选择一张表查看详情</div></div></div>
</section>
</main>
<script>
"use strict";
const byId=id=>document.getElementById(id), state={runs:new Map(),selected:null};
const names=new Set(["summary.json","run.json","table_summary.jsonl","diffs.jsonl","failed_tasks.jsonl","05_compare.jsonl"]);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=String(text);if(cls)n.className=cls;return n}
function statusEl(s){return el("span",s||"—","status "+(s||""))}
function addKV(root,items){const d=el("div",null,"kv");for(const [k,v] of items){d.append(el("span",k),el("span",v??"—"))}root.append(d)}
function section(root,title){const d=el("div",null,"section");d.append(el("h3",title));root.append(d);return d}
function jsonl(text,name){const rows=[];text.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;try{rows.push(JSON.parse(line))}catch(e){throw new Error(`${name} 第 ${i+1} 行不是合法 JSON: ${e.message}`)}});return rows}
function fileKey(f){const path=f.webkitRelativePath||f.name;const parts=path.split("/");parts.pop();return parts.join("/")||"."}
async function load(files){const groups=new Map();for(const f of files){if(!names.has(f.name))continue;const k=fileKey(f);if(!groups.has(k))groups.set(k,new Map());groups.get(k).set(f.name,f)}if(!groups.size)throw new Error("没有找到支持的报告文件");for(const [path,g] of groups){const data={path,summary:null,run:null,tables:[],diffs:[],failed:[],compare:[]};for(const [name,f] of g){const text=await f.text();const val=name.endsWith(".jsonl")?jsonl(text,name):JSON.parse(text);if(name==="summary.json")data.summary=val;else if(name==="run.json")data.run=val;else if(name==="table_summary.jsonl")data.tables=val;else if(name==="diffs.jsonl")data.diffs=val;else if(name==="failed_tasks.jsonl")data.failed=val;else if(name==="05_compare.jsonl")data.compare=val}const runId=data.summary?.run_id||data.run?.run_id||data.tables[0]?.run_id||path;data.id=runId;let id=runId,n=2;while(state.runs.has(id))id=`${runId} (${n++})`;data.id=id;state.runs.set(id,data)}renderRuns()}
function renderRuns(){const select=byId("run"),current=select.value;select.replaceChildren();for(const id of state.runs.keys())select.append(new Option(id,id));if(state.runs.has(current))select.value=current;byId("app").classList.remove("hidden");byId("drop").classList.add("hidden");render()}
function current(){return state.runs.get(byId("run").value)}
function diffCount(d,t){return d.diffs.filter(x=>x.table_id===t.table_id).length}
function render(){const d=current();if(!d)return;if(!state.selected)byId("detail").replaceChildren(el("div","选择一张表查看详情","empty"));const s=d.summary||{},counts=s.tables||Object.fromEntries(["PASS","DIFF","ERROR","BLOCKED","SKIPPED"].map(k=>[k,d.tables.filter(x=>x.status===k).length]));const cards=byId("cards");cards.replaceChildren();for(const [label,val] of [["表总数",counts.total??d.tables.length],["通过",counts.PASS||0],["有差异",counts.DIFF||0],["错误",counts.ERROR||0],["阻塞",counts.BLOCKED||0],["差异明细",s.diffs_written??d.diffs.length],["失败任务",s.failed_tasks??d.failed.length]]){const c=el("div",null,"card");c.append(el("b",val),el("span",label));cards.append(c)}let rows=d.tables.map((x,i)=>({x,i,n:diffCount(d,x)}));const q=byId("search").value.toLowerCase(),st=byId("status").value;if(q)rows=rows.filter(r=>JSON.stringify([r.x.table_id,r.x.source_table,r.x.target_table]).toLowerCase().includes(q));if(st)rows=rows.filter(r=>r.x.status===st);const sort=byId("sort").value;if(sort==="table")rows.sort((a,b)=>a.x.table_id.localeCompare(b.x.table_id));if(sort==="status")rows.sort((a,b)=>a.x.status.localeCompare(b.x.status));if(sort==="diffs")rows.sort((a,b)=>b.n-a.n);const body=byId("tbody");body.replaceChildren();for(const r of rows){const tr=el("tr",null,"click"+(state.selected===r.x.table_id?" selected":""));tr.append(el("td"),el("td",`${r.x.source_table} → ${r.x.target_table}`),el("td"),el("td"),el("td"),el("td",r.n));tr.children[0].append(statusEl(r.x.status));tr.children[2].append(statusEl(r.x.row_count_status));tr.children[3].append(statusEl(r.x.metric_status));tr.children[4].append(statusEl(r.x.sample_status));tr.onclick=()=>{state.selected=r.x.table_id;render();renderDetail(d,r.x)};body.append(tr)}if(state.selected){const t=d.tables.find(x=>x.table_id===state.selected);if(t)renderDetail(d,t);else state.selected=null}}
function renderDetail(d,t){const root=byId("detail");root.replaceChildren();root.append(el("h2",t.table_id));let x=section(root,"概览");addKV(x,[["状态",t.status],["元数据",t.meta_status],["源表",t.source_table],["目标表",t.target_table],["分区（源/目标/共同）",`${t.partitions_src} / ${t.partitions_tgt} / ${t.partitions_common}`],["耗时",`${t.elapsed_s}s`],["说明",t.note||"—"]]);if(t.rules?.length){x=section(root,"规则");for(const r of t.rules){const p=el("span",`${r.key} ${r.status}`,"pill status "+r.status);p.title=r.reason||"";x.append(p)}}if(t.meta_issues?.length){x=section(root,"元数据问题");for(const i of t.meta_issues)x.append(el("div",i))}const comps=d.compare.filter(v=>v.table_id===t.table_id);x=section(root,"分区与规则结果");if(comps.length)table(x,comps,["rule","partition","status","src","tgt","diffs","note"]);else x.append(el("div","没有分区级结果","empty"));const diffs=d.diffs.filter(v=>v.table_id===t.table_id);x=section(root,`差异明细 (${diffs.length})`);if(diffs.length)table(x,diffs,["diff_type","partition","key","group","metric","column","src","tgt","delta","detail"],["src","tgt"]);else x.append(el("div","没有差异明细","empty"));const failed=d.failed.filter(v=>v.table_id===t.table_id);if(failed.length){x=section(root,"失败任务");for(const f of failed){const pre=el("pre",JSON.stringify(f,null,2));x.append(pre)}}x=section(root,"本次运行");const s=d.summary||d.run||{};addKV(x,[["run_id",s.run_id],["创建时间",s.created_at],["报告时间",s.generated_at],["源集群",s.source?`${s.source.host}:${s.source.port}`:s.settings?.source?.host],["目标集群",s.target?`${s.target.host}:${s.target.port}`:s.settings?.target?.host],["工具版本",s.tool_version]])}
function cell(v){if(v===null||v===undefined)return "—";return typeof v==="object"?JSON.stringify(v):String(v)}
function table(root,rows,cols,marked=[]){const wrap=el("div",null,"scroll"),tab=el("table"),head=el("thead"),hr=el("tr"),body=el("tbody");for(const c of cols)hr.append(el("th",c));head.append(hr);for(const r of rows){const tr=el("tr");for(const c of cols){const td=el("td",cell(r[c]),marked.includes(c)?c:"");if(c==="status"){td.replaceChildren(statusEl(r[c]))}tr.append(td)}body.append(tr)}tab.append(head,body);wrap.append(tab);root.append(wrap)}
function error(e){const box=el("div",e.message||String(e),"errorbox");byId("error").replaceChildren(box)}
for(const id of ["dir","files"])byId(id).onchange=e=>load([...e.target.files]).catch(error);
byId("clear").onclick=()=>{state.runs.clear();state.selected=null;byId("app").classList.add("hidden");byId("drop").classList.remove("hidden");byId("error").replaceChildren()};
for(const id of ["run","status","sort"])byId(id).onchange=()=>{state.selected=null;render()};byId("search").oninput=render;
const drop=byId("drop");drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");load([...e.dataTransfer.files]).catch(error)};
</script>
</body>
</html>
