[project]
name = "srdq"
version = "0.1.2"
description = "StarRocks dual-cloud data verification (v1.3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pgserver>=0.1.4",
]

[project.scripts]
srdq = "srdq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["srdq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
