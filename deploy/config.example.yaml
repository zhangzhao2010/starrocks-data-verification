# srdq 配置示例（srdq-config-v1.4）。未知键和旧版本号会被拒绝；改完先运行 `srdq check-config`。
spec_version: srdq-config-v1.4

run_enabled: false

deployment:
  mode: CENTRAL
  controller_location: ALIYUN

physical_clusters:
  - id: huawei-1
    name: Huawei 1
    cloud: HUAWEI
    connection_ref: sr-huawei-1-ro
    credential_file: /etc/srdq/secrets/huawei-1.json
    os_user: srdq-hw1
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}
  - id: aliyun-1
    name: Aliyun 1
    cloud: ALIYUN
    connection_ref: sr-aliyun-1-ro
    credential_file: /etc/srdq/secrets/aliyun-1.json
    os_user: srdq-al1
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}
  - id: huawei-2
    name: Huawei 2
    cloud: HUAWEI
    connection_ref: sr-huawei-2-ro
    credential_file: /etc/srdq/secrets/huawei-2.json
    os_user: srdq-hw2
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}
  - id: aliyun-2
    name: Aliyun 2
    cloud: ALIYUN
    connection_ref: sr-aliyun-2-ro
    credential_file: /etc/srdq/secrets/aliyun-2.json
    os_user: srdq-al2
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}
  - id: huawei-3
    name: Huawei 3
    cloud: HUAWEI
    connection_ref: sr-huawei-3-ro
    credential_file: /etc/srdq/secrets/huawei-3.json
    os_user: srdq-hw3
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}
  - id: aliyun-3
    name: Aliyun 3
    cloud: ALIYUN
    connection_ref: sr-aliyun-3-ro
    credential_file: /etc/srdq/secrets/aliyun-3.json
    os_user: srdq-al3
    concurrency: {COUNT: 40, METRIC: 20, SAMPLE: 10, METADATA: 2, DEEP: 2}

cluster_pairs:
  - {id: pair-1, name: Pair 1, source_cluster_id: huawei-1, target_cluster_id: aliyun-1}
  - {id: pair-2, name: Pair 2, source_cluster_id: huawei-2, target_cluster_id: aliyun-2}
  - {id: pair-3, name: Pair 3, source_cluster_id: huawei-3, target_cluster_id: aliyun-3}

execution_window:
  timezone: Asia/Shanghai
  open_at: "20:00"
  drain_at: "07:30"
  close_at: "08:00"

execution:
  query_timeout_seconds: 300
  lease_seconds: 120
  heartbeat_seconds: 30

transfer:
  global_approval_ref: "<待登记：客户书面审批依据>"

retention:
  raw_value_days: 7

report:
  dir: /var/lib/srdq/reports
  grace_minutes: 15

credentials:
  controller_pg: {file: /etc/srdq/secrets/pg.json, os_user: srdq-ctl, mode: "0600"}

web:
  bind_address: 0.0.0.0
  port: 8470

controller:
  worker_api_bind: 127.0.0.1
  worker_api_port: 8471
  data_dir: /var/lib/srdq/controller

executor:
  controller_url: http://127.0.0.1:8471
  data_dir: /var/lib/srdq/executor
  poll_seconds: 0.2
